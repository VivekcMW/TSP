name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thesocialpundit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # drizzle-kit and the RLS migration run as the owner.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thesocialpundit_test
      OWNER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thesocialpundit_test
      # The app and the tests run as the restricted role, which is what makes
      # the Row-Level Security policies apply. A superuser bypasses them.
      TEST_DATABASE_URL: postgresql://tsp_app:tsp_app_local@localhost:5432/thesocialpundit_test
      # The suite fakes Clerk at the module boundary, so these only need to
      # exist for modules that read them at import time.
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      OAUTH_STATE_SECRET: ci_placeholder_state_secret
      APP_URL: http://localhost:3000
      # Must never be true here: the tests assert real authorization behaviour.
      DEV_AUTH_BYPASS: ""
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Keep CI aligned with the checked-in pnpm lockfile.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Design tokens are in sync
        run: pnpm run design:check

      # Migrations, not `drizzle-kit push`. push diffs against the live
      # database and was observed dropping the RLS policies, which would make
      # the isolation tests pass against an unprotected schema — the worst
      # possible failure mode for this suite.
      - name: Migrate the test database
        run: pnpm run db:migrate
        env:
          OWNER_DATABASE_URL: ${{ env.DATABASE_URL }}

      # Includes the cross-tenant isolation contract tests. A failure here is a
      # data-leak risk, not a flaky test — do not skip or retry this step.
      - name: Install Chromium for browser regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        run: pnpm test

      - name: Browser E2E tests
        if: ${{ env.E2E_TEST_EMAIL != '' && env.E2E_TEST_PASSWORD != '' }}
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: Verify production artifact
        run: test -f dist/index.cjs && test -f dist/public/index.html
